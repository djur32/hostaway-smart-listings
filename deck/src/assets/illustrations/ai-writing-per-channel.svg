<svg xmlns="http://www.w3.org/2000/svg" class="aw" viewBox="0 0 320 220" width="320" height="220" role="img" aria-labelledby="aw-t aw-d"><title id="aw-t">AI writing per channel</title><desc id="aw-d">The host steers a giant yellow pencil that draws three lavender lines, one per channel (Airbnb, Booking.com, Vrbo), with sparkles of AI.</desc><style>.aw .up{animation:aw0 4.2s ease-in-out infinite alternate}@keyframes aw0{to{transform:translateY(-2px)}}.aw .head{animation:aw1 5.2s ease-in-out infinite alternate;transform-box:view-box;transform-origin:86.0px 82.0px}@keyframes aw1{to{transform:rotate(4deg)}}.aw .arm{animation:aw2 3.0s ease-in-out infinite alternate;transform-box:view-box;transform-origin:100.0px 100.0px}@keyframes aw2{to{transform:rotate(1.4deg)}}.aw .spark{animation:aw3 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes aw3{to{transform:scale(.6) rotate(20deg);opacity:.6}}.aw .spark2{animation:aw4 3.4s ease-in-out 0.6s infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes aw4{to{transform:scale(.55) rotate(-20deg);opacity:.5}}@media (prefers-reduced-motion:reduce){.aw,.aw *{animation:none!important}}</style><path d="M283.8 165.0C276.8 175.5 248.1 185.9 228.3 187.6C208.4 189.2 175.9 184.1 164.7 174.8C153.6 165.6 153.7 143.9 161.6 132.1C169.5 120.3 193.9 105.5 212.0 104.2C230.1 102.9 258.1 114.0 270.0 124.2C282.0 134.3 290.7 154.4 283.8 165.0Z" fill="#ffe4e7"/><circle cx="164" cy="135" r="3.6" fill="#ff5a5f"/><path d="M173 135H222" fill="none" stroke="#936acd" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="150" r="3.6" fill="#273b7d"/><path d="M173 150H247" fill="none" stroke="#936acd" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="165" r="3.6" fill="#0885f2"/><path d="M173 165H231" fill="none" stroke="#936acd" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><g class="spark"><path transform=