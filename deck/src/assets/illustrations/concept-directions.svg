<svg xmlns="http://www.w3.org/2000/svg" class="cd" viewBox="0 0 320 220" width="320" height="220" role="img" aria-labelledby="cd-t cd-d"><title id="cd-t">Choosing a direction</title><desc id="cd-d">Four tiles, the directions, each with a small mark of its own; one is yellow and ringed in raspberry, the chosen one. The host, hand on chin, weighs them.</desc><style>.cd .up{animation:cd0 4.2s ease-in-out infinite alternate}@keyframes cd0{to{transform:translateY(-2px)}}.cd .head{animation:cd1 5.0s ease-in-out infinite alternate;transform-box:view-box;transform-origin:98.0px 82.0px}@keyframes cd1{to{transform:rotate(5deg)}}.cd .pick{animation:cd2 3.2s ease-in-out infinite alternate}@keyframes cd2{to{transform:translateY(-2px)}}.cd .doodle{animation:cd3 6.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes cd3{to{transform:rotate(12deg)}}.cd .spark{animation:cd4 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes cd4{to{transform:scale(.6) rotate(20deg);opacity:.6}}.cd .doodle2{animation:cd5 3.4s ease-in-out infinite alternate}@keyframes cd5{to{opacity:.55}}@media (prefers-reduced-motion:reduce){.cd,.cd *{animation:none!important}}</style><path d="M281.4 108.7C274.9 122.8 247.9 136.6 229.3 138.8C210.6 141.0 180.0 134.1 169.6 121.8C159.1 109.5 159.2 80.5 166.6 64.8C174.0 49.2 197.0 29.4 214.0 27.6C231.0 25.9 257.3 40.8 268.5 54.3C279.7 67.8 287.9 94.6 281.4 108.7Z" fill="#d9f2f0"/><g class="doodle2"><path d="M258.0 176.0 l11.5 -16.4" fill="none" stroke="#fedf89" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M268.0 179.0 l11.5 -16.4" fill="none" stroke="#fedf89" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M278.0 182.0 l11.5 -16.4" fill="none" stroke="#fedf89" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="spark"><path transform="translate(276 38) scale(0.55)" fill="#08b6b2" d="M0-10C1.2-3 3-1.2 10 0 3 1.2