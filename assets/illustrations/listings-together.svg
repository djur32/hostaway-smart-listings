<svg xmlns="http://www.w3.org/2000/svg" class="lt" viewBox="0 0 320 220" width="320" height="220" role="img" aria-labelledby="lt-t lt-d"><title id="lt-t">Bringing listings together</title><desc id="lt-d">The host rests a hand on one yellow house while three small tiles, the Airbnb, Booking.com and Vrbo listings, float down a dotted trail into its roof.</desc><style>.lt .up{animation:lt0 4.2s ease-in-out infinite alternate}@keyframes lt0{to{transform:translateY(-2px)}}.lt .head{animation:lt1 5.2s ease-in-out infinite alternate;transform-box:view-box;transform-origin:100.0px 82.0px}@keyframes lt1{to{transform:rotate(-4deg)}}.lt .drift{animation:lt2 3.4s ease-in-out infinite alternate}@keyframes lt2{to{transform:translate(-3px,2px)}}.lt .flow{animation:lt3 2.4s linear infinite normal}@keyframes lt3{to{stroke-dashoffset:-12.2}}.lt .spark{animation:lt4 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes lt4{to{transform:scale(.6) rotate(20deg);opacity:.6}}.lt .doodle2{animation:lt5 3.4s ease-in-out infinite alternate}@keyframes lt5{to{opacity:.55}}@media (prefers-reduced-motion:reduce){.lt,.lt *{animation:none!important}}</style><path d="M227.5 167.9C221.1 181.5 195.1 194.8 177.0 196.9C159.0 199.0 129.4 192.4 119.3 180.5C109.2 168.6 109.2 140.7 116.4 125.6C123.6 110.5 145.8 91.4 162.2 89.7C178.7 88.0 204.1 102.4 215.0 115.4C225.9 128.4 233.8 154.3 227.5 167.9Z" fill="#d9f2f0"/><g class="doodle2"><path d="M22.0 58.0 l11.5 -16.4" fill="none" stroke="#fedf89" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32.0 61.0 l11.5 -16.4" fill="none" stroke="#fedf89" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M42.0 64.0 l11.5 -16.4" fill="none" stroke="#fedf89" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M286 28C250 30 206 52 180 88" fill="none" stroke="#17323a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="flow" stroke-dasha