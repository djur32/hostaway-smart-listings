<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" role="img" aria-labelledby="t d" font-family="'TT Norms', 'TT Norms Pro', -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Card sort dendrogram</title>
<desc id="d">Average-linkage clustering of 40 cards. The dashed line is the cut (6 clusters) at the largest gap between merge heights. Cophenetic correlation shows how faithfully the tree keeps the distances.</desc>
