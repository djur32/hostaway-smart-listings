<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="TT Norms, ui-sans-serif, system-ui, sans-serif">
<!-- S16 · product map · colours are ds/tokens.css values: ink gray-900 #191b1f · muted gray-500 #70747b · border gray-200 #e6e7ea ·
     surface gray-50 #f9fafb · primary-600 #e1295a · sidebar-bg #1a0a33 · ai-surface #f6f0ff · ai-accent #8155be · success-500 #1d9e7a -->
<defs>
  <style>
    @font-face { font-family: "TT Norms"; src: url("../../../ds/fonts/TTNorms-400.woff") format("woff"); font-weight: 400; }
    @font-face { font-family: "TT Norms"; src: url("../../../ds/fonts/TTNorms-500.woff") format("woff"); font-weight: 500; }
    @font-face { font-family: "TT Norms"; src: url("../../../ds/fonts/TTNorms-700.woff") format("woff"); font-weight: 700; }
    .t  { fill:#191b1f; font-size:15px; font-weight:500 }
    .h  { fill:#191b1f; font-size:17px; font-weight:700 }
    .s  { fill:#70747b; font-size:13px; font-weight:400 }
    .w  { fill:#ffffff; font-size:17px; font-weight:700 }
    .ws { fill:#d9cdef; font-size:13px; font-weight:400 }
    .lab{ fill:#53575b; font-size:12px; font-weight:500 }
    .new{ fill:#bc1445; font-size:12px; font-weight:500 }
    .box{ fill:#ffffff; stroke:#e6e7ea; stroke-width:1.5 }
    .old{ stroke:#a0a5ab; stroke-width:1.6; fill:none }
    .chg{ stroke:#e1295a; stroke-width:2.2; fill:none; stroke-dasharray:7 5 }
  </style>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a5ab"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e1295a"/></marker>
</defs>
<rect width="1600" height="940" fill="#ffffff"/>

<text x="40" y="52" style="fill:#191b1f;font-size:28px;font-weight:700">How the property record flows through Hostaway</text>
<text x="40" y="80" class="s" style="font-size:15px">Shared is written once and read everywhere. Each channel uses the Base, is customised, or is set by the channel.</text>

<!-- legend -->
<line x1="1200" y1="47" x2="1250" y2="47" class="old" marker-end="url(#ag)"/><text x="1260" y="52" class="lab">exists today, unchanged in kind</text>
<line x1="1200" y1="73" x2="1250" y2="73" class="chg" marker-end="url(#ar)"/><text x="1260" y="78" class="new">new or changed by this proposal</text>

<!-- inputs -->
<text x="40" y="132" class="lab" style="letter-spacing:.08em">IN</text>
<rect x="40" y="145" width="250" height="88" rx="10" class="box"/>
<text x="58" y="175" class="h">Similar homes (comps)</text><text x="58" y="198" class="s">frame the strategy, cited as a</text><text x="58" y="218" class="s">tip's "Why" · ASSUMPTION</text>
<rect x="40" y="250" width="250" height="88" rx="10" class="box"/>
<text x="58" y="280" class="h">Import</text><text x="58" y="303" class="s">Airbnb · Booking.com listings</text><text x="58" y="323" class="s">"What we found", reconcile once</text>
<rect x="40" y="355" width="250" height="88" rx="10" class="box"/>
<text x="58" y="385" class="h">The host</text><text x="58" y="408" class="s">web · phone app · describe a fact</text><text x="58" y="428" class="s">by voice</text>

<!-- Smart Listings -->
<rect x="470" y="110" width="540" height="96" rx="12" fill="#f6f0ff" stroke="#d9cdef" stroke-width="1.5"/>
<text x="492" y="142" style="fill:#6b41a4;font-size:17px;font-weight:700">Smart Listings · opt-in per property</text>
<text x="492" y="166" class="s">strategy per channel · tips with their Why · Autopilot off, or on inside guardrails</text>
<text x="492" y="187" class="s">Performance: this strategy vs the same days before it</text>

<!-- Shared -->
<rect x="470" y="255" width="540" height="230" rx="14" fill="#1a0a33"/>
<text x="492" y="290" class="w">Shared · the property record</text>
<text x="492" y="312" class="ws">every fact has one home and one Base value</text>
<rect x="492" y="330" width="240" height="132" rx="10" fill="#321e52"/>
<text x="510" y="360" class="w" style="font-size:16px">Listing base</text>
<text x="510" y="383" class="ws">name, summary, the space,</text><text x="510" y="402" class="ws">amenities, house rules, photos,</text><text x="510" y="421" class="ws">base pricing, stay rules</text><text x="510" y="447" class="ws">"what every channel lists"</text>
<rect x="748" y="330" width="240" height="132" rx="10" fill="#321e52"/>
<text x="766" y="360" class="w" style="font-size:16px">Knowledge Hub</text>
<text x="766" y="383" class="ws">facts by topic with sources,</text><text x="766" y="402" class="ws">guests' questions answered once,</text><text x="766" y="421" class="ws">Wi-Fi, arrival, local tips</text><text x="766" y="447" class="ws">"what the assistant knows"</text>

<!-- push -->
<rect x="1060" y="110" width="110" height="375" rx="12" fill="#f9fafb" stroke="#e6e7ea" stroke-width="1.5"/>
<text x="1115" y="278" text-anchor="middle" class="h" style="font-size:15px">Save</text>
<text x="1115" y="304" text-anchor="middle" class="s">sends each</text><text x="1115" y="322" text-anchor="middle" class="s">change, with</text>
<text x="1115" y="340" text-anchor="middle" class="s">a receipt</text>
<text x="1115" y="350" text-anchor="middle" class="s"></text>

<!-- channels -->
<text x="1215" y="132" class="lab" style="letter-spacing:.08em">CHANNELS · inherit · override · set by channel</text>
<rect x="1215" y="145" width="345" height="74" rx="10" class="box"/>
<text x="1233" y="174" class="h">Airbnb</text><text x="1233" y="198" class="s">text, photo order, fees, rules, check-in method</text>
<rect x="1215" y="229" width="345" height="74" rx="10" class="box"/>
<text x="1233" y="258" class="h">Booking.com</text><text x="1233" y="282" class="s">facts, money, rules · description set by Booking.com</text>
<rect x="1215" y="313" width="345" height="74" rx="10" class="box"/>
<text x="1233" y="342" class="h">Direct booking site</text><text x="1233" y="366" class="s">Base text + Direct strategy, Hostaway's own</text>
<rect x="1215" y="397" width="345" height="88" rx="10" class="box" style="stroke-dasharray:5 4"/>
<text x="1233" y="426" class="h">Google Vacation Rentals</text><text x="1233" y="450" class="s">a feed of facts, price, availability</text><text x="1233" y="470" class="s">route not captured · ASSUMPTION</text>

<!-- arrows: inputs -> shared / smart -->
<path d="M290 175 L468 175" class="chg" marker-end="url(#ar)"/>
<text x="318" y="166" class="new">market framing</text>
<path d="M290 294 L468 294" class="chg" marker-end="url(#ar)"/>
<text x="318" y="285" class="new">facts, reconciled</text>
<path d="M290 399 L468 399" class="old" marker-end="url(#ag)"/>
<text x="318" y="390" class="lab">edits</text>

<!-- shared -> smart (Why) and smart -> push -->
<path d="M740 255 L740 208" class="chg" marker-end="url(#ar)"/>
<text x="750" y="238" class="new">facts as a tip's Why</text>
<path d="M1010 158 L1058 158" class="chg" marker-end="url(#ar)"/>
<!-- shared -> push -->
<path d="M1010 400 L1058 400" class="chg" marker-end="url(#ar)"/>
<text x="1042" y="422" class="new">Base</text>
<!-- push -> channels -->
<path d="M1170 182 L1213 182" class="chg" marker-end="url(#ar)"/>
<path d="M1170 266 L1213 266" class="chg" marker-end="url(#ar)"/>
<path d="M1170 350 L1213 350" class="chg" marker-end="url(#ar)"/>
<path d="M1170 441 L1213 441" class="chg" marker-end="url(#ar)"/>

<!-- consumers -->
<g>
  <rect x="40"   y="640" width="205" height="128" rx="10" class="box"/>
  <text x="56" y="668" class="t">Guest messaging AI</text><text x="56" y="692" class="s">reads Hub facts (today)</text><text x="56" y="711" class="new">+ the Base, so replies and</text><text x="56" y="729" class="new">listings can't disagree</text>

  <rect x="257"  y="640" width="205" height="128" rx="10" class="box"/>
  <text x="273" y="668" class="t">Guidebook</text><text x="273" y="692" class="s">local tips, house manual</text><text x="273" y="711" class="new">one house manual, from</text><text x="273" y="729" class="new">the Base</text>

  <rect x="474"  y="640" width="205" height="128" rx="10" class="box"/>
  <text x="490" y="668" class="t">Dynamic Pricing</text><text x="490" y="687" class="t">&amp; Calendar</text><text x="490" y="711" class="new">reads the strategy's goal</text><text x="490" y="729" class="new">and price guardrails</text>

  <rect x="691"  y="640" width="205" height="128" rx="10" class="box"/>
  <text x="707" y="668" class="t">Operations</text><text x="707" y="692" class="s">tasks from check-in times</text><text x="707" y="711" class="new">+ beds, linens, guests</text><text x="707" y="729" class="new">from Base facts · ASSUMPTION</text>

  <rect x="908"  y="640" width="205" height="128" rx="10" class="box"/>
  <text x="924" y="668" class="t">Devices</text><text x="924" y="692" class="s">smart locks, codes</text><text x="924" y="711" class="new">lock facts set the check-in</text><text x="924" y="729" class="new">method · ASSUMPTION</text>

  <rect x="1125" y="640" width="205" height="128" rx="10" class="box"/>
  <text x="1141" y="668" class="t">Metrics</text><text x="1141" y="692" class="s">reservations, occupancy</text><text x="1141" y="711" class="new">per channel, per strategy</text><text x="1141" y="729" class="new">period → Performance</text>

  <rect x="1342" y="640" width="218" height="128" rx="10" class="box"/>
  <text x="1358" y="668" class="t">Owner statements</text><text x="1358" y="692" class="s">fees, taxes</text><text x="1358" y="711" class="new">+ receipts as the audit</text><text x="1358" y="729" class="new">trail of what changed</text>
</g>

<!-- shared -> consumers fan -->
<path d="M520 485 V540 H142 V638" class="chg" marker-end="url(#ar)"/>
<path d="M560 485 V560 H360 V638" class="chg" marker-end="url(#ar)"/>
<path d="M620 485 V638" class="chg" marker-end="url(#ar)"/>
<path d="M793 485 V638" class="old" marker-end="url(#ag)"/>
<path d="M880 485 V540 H1010 V638" class="old" marker-end="url(#ag)"/>
<path d="M960 485 V520 H1450 V638" class="chg" marker-end="url(#ar)"/>
<!-- smart -> pricing (goal) -->
<path d="M470 196 H440 V610 H560 V638" class="chg" marker-end="url(#ar)"/>
<!-- metrics -> smart (performance loop) -->
<path d="M1228 638 V600 H1035 V232 H960 V209" class="chg" marker-end="url(#ar)"/>
<text x="1045" y="592" class="new">results per strategy period</text>

<rect x="34" y="604" width="380" height="24" fill="#ffffff"/>
<text x="40" y="620" class="lab" style="letter-spacing:.08em">THE REST OF HOSPITABLE READS THE SAME RECORD</text>
<!-- footnote -->
<text x="40" y="815" class="s">Today's consumers come from the product audit (REAL·PRODUCT, REAL·PUBLIC). Arrows and changes marked new are this proposal (ASSUMPTION until Integrations, Data and Ops confirm them).</text>
<text x="40" y="837" class="s">Booking.com writes its own description from facts (REAL·PUBLIC), so better facts are how a host improves it. Pricing and rules never change on Autopilot.</text>
<text x="40" y="875" style="fill:#191b1f;font-size:15px;font-weight:700">Today: 14 consumers read two stores that disagree (14 of 28 facts match). Proposed: one record, read by all of them.</text>
</svg>
