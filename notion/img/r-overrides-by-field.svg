<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 622" width="1000" height="622" role="img" aria-labelledby="t d" font-family="'TT Norms', 'TT Norms Pro', -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Which fields hosts keep different per channel</title>
